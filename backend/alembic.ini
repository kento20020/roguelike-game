# Alembic config (part of OPEN-027 ops groundwork).
# DB URL is resolved by migrations/env.py from app.db.session.DATABASE_URL
# (respects the DATABASE_URL environment variable).
# NOTE: keep this file ASCII-only. configparser on Windows reads it with the
# locale encoding (cp932) and non-ASCII bytes break `alembic` commands.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
