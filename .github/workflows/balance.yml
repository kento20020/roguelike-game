name: balance

# §18 バランス検証フレームワークのCIゲート。
# Phase0(全テスト) と Phase5(回帰ゲート test_balance_regression) を push/PR で実行。
# 数値変更でバランスが基準から逸脱したら赤くなる（意図的なら gen_baseline で承認）。

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  balance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Phase0 unit/engine tests
        run: pytest -q --cov=app --cov=main --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
      - name: Phase5 balance regression gate
        run: pytest -q tests/test_balance_regression.py

  # 静的解析ゲート（balance と並列）。設定は backend/pyproject.toml。
  # ruff = lint（E,F,W,I,B,UP。E501/UP045 等は段階導入で ignore）、
  # mypy = 型検査（CLAUDE.md「型ヒント必須」規約の自動検証。overrides は pyproject 参照）。
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type check)
        run: mypy app main.py
