name: docs-ci

# paths には docs/** に加え、check_docs.py が突合で読む「コード側の正本」も含める。
# 含めないと、コード側だけを変える PR（例: モデル追加・コンポーネント追加・バランス JSON 変更）で
# drift 検査が走らず、不一致が黙ってマージされる（検査3=ミラー・4=API契約・9=テーブル・10=コンポーネント・11=敵表）。
on:
  push:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-ci.yml"
      - "backend/app/data/**"
      - "backend/app/api/routes.py"
      - "backend/app/db/models.py"
      - "frontend/src/components/**"
      - "frontend/src/pages/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-ci.yml"
      - "backend/app/data/**"
      - "backend/app/api/routes.py"
      - "backend/app/db/models.py"
      - "frontend/src/components/**"
      - "frontend/src/pages/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: docs 整合チェック（check_docs.py の11検査＝JSON妥当性・リンク・ミラー・API契約・版/OPEN整合・doc⇄コードdrift）
        run: python scripts/check_docs.py
