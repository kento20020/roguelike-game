name: docs-ci

# path フィルタを使わず常時実行する（意図的な例外・CONTRIBUTING §7）。
# 理由: check_docs.py は docs とコード側正本の「二辺比較」のため、どちらの辺の変更でも
# 走る必要がある。paths で表現するとスクリプトが読むファイル一覧との二重管理になり、
# 追随漏れで「コード側だけの PR では検査が走らず drift が黙ってマージされる」穴が再発する
# （実例: PR #37 は check-docs 未実行でマージされていた）。標準ライブラリのみ・実行約1秒の
# 軽量検査なので、常時実行のコストより二重管理をなくす利益が大きい。
# 常時実行＝全 PR でステータス報告されるため、check-docs をブランチ保護の必須チェックにできる。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: docs 整合チェック（check_docs.py の11検査＝JSON妥当性・リンク・ミラー・API契約・版/OPEN整合・doc⇄コードdrift）
        run: python scripts/check_docs.py
