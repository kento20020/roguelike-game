name: docs-ci

on:
  push:
    paths:
      - "docs/**"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    paths:
      - "docs/**"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: docs 整合チェック（schemas JSON妥当性・相対リンク切れ）
        run: python scripts/check_docs.py
