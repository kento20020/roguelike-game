# Dependabot設定。
# 依存関係の脆弱性検知・更新PRを自動化する。pip(backend)/npm(frontend)/github-actions(全体)の
# 3エコシステムを対象に週次でチェックし、minor/patchはgroupsで1本のPRにまとめてノイズを減らし、
# majorは互換性影響が大きいため個別PRのまま人間のレビューに委ねる。
version: 2
updates:
  # --- backend: pip ---
  # requirements.in / requirements-dev.in から pip-compile で requirements.txt / requirements-dev.txt
  # を生成する運用（前タスクで移行済み）。生成された .txt 先頭の
  # 「autogenerated by pip-compile」ヘッダーと .in ファイルの対応関係を Dependabot が認識し、
  # .in の依存指定を更新した上で pip-compile を再実行し .txt ロックファイルごと更新するPRを作る。
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- frontend: npm ---
  # package-lock.json（npm ci で解決される完全ロック）の更新を検知する。
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- リポジトリ全体: GitHub Actions ---
  # .github/workflows/ 内で使用しているアクション（actions/checkout@v4 等）のバージョン更新。
  # 対象件数が少ない想定のため groups は付けていない（必要になれば後で追加する）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
